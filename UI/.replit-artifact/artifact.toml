kind = "mobile"
previewPath = "/"
title = "VeriSight AI"
description = "A premium mobile media forensics app for investigating whether images and videos are AI-generated, altered, authentic, or inconclusive, with mock analysis, source discovery, propagation tracking, and investigation history."
version = "1.0.0"
id = "artifacts/verisight-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20785

[services.development]
run = "pnpm --filter @workspace/verisight-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verisight-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/verisight-ai", "run", "serve" ]

[services.env]
PORT = "20785"
BASE_PATH = "/"
